# Consolidated message templates: tools, errors, system, commands, buttons.
# Single source of truth for all user-facing strings.
# Three languages: hi-Hind (Hinglish), hi-Deva (Devanagari), en (English).

_manifest:
  required_languages: [hi-Hind, hi-Deva, en]
  tools:
    save_sale:        [confirmation, closing]
    record_payment:   [confirmation, closing]
    save_production:  [confirmation, closing]
    save_cash_flow:   [confirmation, closing]
    create_customer:  [confirmation, closing]
    delete_record:    [confirmation, closing]
  errors:    [numeric_overflow, customer_not_found, duplicate_record,
              invalid_value, permission_denied, db_connection_error,
              db_error, generic]
  selection: [multiple_matches, not_found]
  system:    [cancellation, selection_expired, confirmation_expired,
              rate_limit_user, rate_limit_server, max_iterations,
              parse_error, generic_error, invalid_selection,
              history_cleared]
  buttons:   [confirm_yes, confirm_no]
  commands:  [start, help, status_connected, status_disconnected]
  flat:      [confirmation_preamble]

branding:
  bot_name: "Labbu"
  currency_symbol: "₹"
  factory_name: "Namkeen factory"

# ============================================================================
# TOOL CONFIRMATION & CLOSING MESSAGES
# ============================================================================

tools:
  save_sale:
    confirmation:
      hi-Hind: |
        📦 *Sale confirm kijiye:*
        ─────────────────
        Customer: {{ customer_label }}
        Qty: *{{ qty_kg }} kg* @ *₹{{ rate_per_kg }}/kg*
        Total: *{{ format_amount(qty_kg * rate_per_kg) }}*
        Date: `{{ sale_date }}`
        Payment: *{{ payment_status }}*{% if payment_mode %} ({{ payment_mode }}){% endif %}
        {% if notes %}Notes: {{ notes }}{% endif %}
      hi-Deva: |
        📦 *बिक्री confirm kijiye:*
        ─────────────────
        Customer: {{ customer_label }}
        मात्रा: *{{ qty_kg }} किलो* @ *₹{{ rate_per_kg }}/किलो*
        कुल: *{{ format_amount(qty_kg * rate_per_kg) }}*
        दिनांक: `{{ sale_date }}`
        भुगतान: *{{ payment_status }}*{% if payment_mode %} ({{ payment_mode }}){% endif %}
        {% if notes %}नोट: {{ notes }}{% endif %}
      en: |
        📦 *Confirm sale:*
        ─────────────────
        Customer: {{ customer_label }}
        Quantity: *{{ qty_kg }} kg* @ *₹{{ rate_per_kg }}/kg*
        Total: *{{ format_amount(qty_kg * rate_per_kg) }}*
        Date: `{{ sale_date }}`
        Payment: *{{ payment_status }}*{% if payment_mode %} ({{ payment_mode }}){% endif %}
        {% if notes %}Notes: {{ notes }}{% endif %}
    closing:
      hi-Hind: "✅ *Sale saved:* {{ qty_kg }} kg @ ₹{{ rate_per_kg }}/kg = *{{ format_amount(total_bill) }}*. Customer: {{ customer_label }}."
      hi-Deva: "✅ *बिक्री सेव हो गई:* {{ qty_kg }} किलो @ ₹{{ rate_per_kg }}/किलो = *{{ format_amount(total_bill) }}*. {{ customer_label }} को।"
      en: "✅ *Sale saved:* {{ qty_kg }} kg @ ₹{{ rate_per_kg }}/kg = *{{ format_amount(total_bill) }}*. Customer: {{ customer_label }}."

  record_payment:
    confirmation:
      hi-Hind: |
        💳 *Payment confirm kijiye:*
        ─────────────────
        Customer: {{ customer_label }}
        Amount: *{{ format_amount(amount) }}*
        Date: `{{ payment_date }}`
        Mode: *{{ payment_mode or "cash" }}*
        {% if notes %}Notes: {{ notes }}{% endif %}
      hi-Deva: |
        💳 *भुगतान confirm kijiye:*
        ─────────────────
        Customer: {{ customer_label }}
        रकम: *{{ format_amount(amount) }}*
        दिनांक: `{{ payment_date }}`
        तरीका: *{{ payment_mode or "cash" }}*
        {% if notes %}नोट: {{ notes }}{% endif %}
      en: |
        💳 *Confirm payment:*
        ─────────────────
        Customer: {{ customer_label }}
        Amount: *{{ format_amount(amount) }}*
        Date: `{{ payment_date }}`
        Mode: *{{ payment_mode or "cash" }}*
        {% if notes %}Notes: {{ notes }}{% endif %}
    closing:
      hi-Hind: "💳 *Payment saved:* *{{ format_amount(amount) }}* from {{ customer_label }}. Naya baqaya: *{{ format_amount(new_balance) }}*."
      hi-Deva: "💳 *भुगतान सेव हो गया:* *{{ format_amount(amount) }}* — {{ customer_label }} से। नया बकाया: *{{ format_amount(new_balance) }}*।"
      en: "💳 *Payment saved:* *{{ format_amount(amount) }}* from {{ customer_label }}. New balance: *{{ format_amount(new_balance) }}*."

  save_production:
    confirmation:
      hi-Hind: |
        🏭 *Production confirm kijiye:*
        ─────────────────
        Date: `{{ prod_date }}`
        Qty: *{{ total_produced_kg }} kg*
        Packets: *{{ total_packets }}*
        {% if notes %}Notes: {{ notes }}{% endif %}
      hi-Deva: |
        🏭 *उत्पादन confirm kijiye:*
        ─────────────────
        दिनांक: `{{ prod_date }}`
        मात्रा: *{{ total_produced_kg }} किलो*
        पैकेट: *{{ total_packets }}*
        {% if notes %}नोट: {{ notes }}{% endif %}
      en: |
        🏭 *Confirm production:*
        ─────────────────
        Date: `{{ prod_date }}`
        Quantity: *{{ total_produced_kg }} kg*
        Packets: *{{ total_packets }}*
        {% if notes %}Notes: {{ notes }}{% endif %}
    closing:
      hi-Hind: "🏭 *Production saved:* *{{ total_produced_kg }} kg*, *{{ total_packets }}* packets (`{{ prod_date }}`)."
      hi-Deva: "🏭 *उत्पादन सेव हो गया:* *{{ total_produced_kg }} किलो*, *{{ total_packets }}* पैकेट (`{{ prod_date }}`)।"
      en: "🏭 *Production saved:* *{{ total_produced_kg }} kg*, *{{ total_packets }}* packets (`{{ prod_date }}`)."

  save_cash_flow:
    confirmation:
      hi-Hind: |
        {% if flow_type == "in" %}💰{% else %}💸{% endif %} *Cash {{ flow_type }} confirm kijiye:*
        ─────────────────
        Date: `{{ flow_date }}`
        Amount: *{{ format_amount(amount) }}*
        Category: *{{ category }}*
        Description: {{ description }}
        Party: {{ party or "–" }}
        {% if notes %}Notes: {{ notes }}{% endif %}
      hi-Deva: |
        {% if flow_type == "in" %}💰{% else %}💸{% endif %} *कैश {% if flow_type == "in" %}जमा{% else %}खर्च{% endif %} confirm kijiye:*
        ─────────────────
        दिनांक: `{{ flow_date }}`
        रकम: *{{ format_amount(amount) }}*
        श्रेणी: *{{ category }}*
        विवरण: {{ description }}
        पार्टी: {{ party or "–" }}
        {% if notes %}नोट: {{ notes }}{% endif %}
      en: |
        {% if flow_type == "in" %}💰{% else %}💸{% endif %} *Confirm cash {{ flow_type }}:*
        ─────────────────
        Date: `{{ flow_date }}`
        Amount: *{{ format_amount(amount) }}*
        Category: *{{ category }}*
        Description: {{ description }}
        Party: {{ party or "–" }}
        {% if notes %}Notes: {{ notes }}{% endif %}
    closing:
      hi-Hind: "{% if flow_type == 'in' %}💰{% else %}💸{% endif %} *Cash {{ flow_type }}:* *{{ format_amount(amount) }}* ({{ category }})."
      hi-Deva: "{% if flow_type == 'in' %}💰{% else %}💸{% endif %} *कैश {% if flow_type == 'in' %}जमा{% else %}खर्च{% endif %}:* *{{ format_amount(amount) }}* ({{ category }})।"
      en: "{% if flow_type == 'in' %}💰{% else %}💸{% endif %} *Cash {{ flow_type }}:* *{{ format_amount(amount) }}* ({{ category }})."

  create_customer:
    confirmation:
      hi-Hind: |
        👤 *New customer confirm kijiye:*
        ─────────────────
        Shop: *{{ shop_name }}*
        Owner: {{ owner_name or "–" }}
        Phone: {{ owner_phone or "–" }}
        Credit limit: *{{ format_amount(credit_limit or 0) }}*
        {% if address %}Address: {{ address }}{% endif %}
      hi-Deva: |
        👤 *नया ग्राहक confirm kijiye:*
        ─────────────────
        दुकान: *{{ shop_name }}*
        मालिक: {{ owner_name or "–" }}
        फोन: {{ owner_phone or "–" }}
        क्रेडिट सीमा: *{{ format_amount(credit_limit or 0) }}*
        {% if address %}पता: {{ address }}{% endif %}
      en: |
        👤 *Confirm new customer:*
        ─────────────────
        Shop: *{{ shop_name }}*
        Owner: {{ owner_name or "–" }}
        Phone: {{ owner_phone or "–" }}
        Credit limit: *{{ format_amount(credit_limit or 0) }}*
        {% if address %}Address: {{ address }}{% endif %}
    closing:
      hi-Hind: "👤 *New customer added:* *{{ shop_name }}* (id: `{{ customer_id }}`)."
      hi-Deva: "👤 *नया ग्राहक जुड़ गया:* *{{ shop_name }}* (id: `{{ customer_id }}`)।"
      en: "👤 *New customer added:* *{{ shop_name }}* (id: `{{ customer_id }}`)."

  delete_record:
    confirmation:
      hi-Hind: |
        🗑️ *Delete confirm kijiye:*
        ─────────────────
        Table: `{{ table }}`
        Record ID: `{{ record_id }}`
        Reason: {{ reason or "–" }}

        ⚠️ *Soft delete* — recoverable from logs.
      hi-Deva: |
        🗑️ *डिलीट confirm kijiye:*
        ─────────────────
        तालिका: `{{ table }}`
        रिकॉर्ड ID: `{{ record_id }}`
        कारण: {{ reason or "–" }}

        ⚠️ *Soft delete* — logs से recover हो सकता है।
      en: |
        🗑️ *Confirm delete:*
        ─────────────────
        Table: `{{ table }}`
        Record ID: `{{ record_id }}`
        Reason: {{ reason or "–" }}

        ⚠️ *Soft delete* — recoverable from logs.
    closing:
      hi-Hind: "🗑️ *Deleted* record `{{ record_id }}` from `{{ table }}`."
      hi-Deva: "🗑️ *डिलीट हो गया* — रिकॉर्ड `{{ record_id }}` (`{{ table }}` से)।"
      en: "🗑️ *Deleted* record `{{ record_id }}` from `{{ table }}`."

# ============================================================================
# QUERY RESULT LIST TEMPLATES (Read-only queries)
# ============================================================================

queries:
  query_customers:
    list:
      hi-Hind: |
        👥 *{{ count }} customers:*
        {% for c in rows %}* *{{ c.shop_name }}* (id: `{{ c.id }}`) — owner: {{ c.owner_name or "—" }}, limit: ₹{{ c.credit_limit or "∞" }}
        {% endfor %}
      hi-Deva: |
        👥 *{{ count }} customers:*
        {% for c in rows %}* *{{ c.shop_name }}* (id: `{{ c.id }}`) — मालिक: {{ c.owner_name or "—" }}, सीमा: ₹{{ c.credit_limit or "∞" }}
        {% endfor %}
      en: |
        👥 *{{ count }} customers:*
        {% for c in rows %}* *{{ c.shop_name }}* (id: `{{ c.id }}`) — owner: {{ c.owner_name or "—" }}, limit: ₹{{ c.credit_limit or "∞" }}
        {% endfor %}

  query_sales:
    list:
      hi-Hind: |
        📊 *{{ count }} sales:*
        {% for s in rows %}* {{ s.sale_date }} — *{{ s.shop_name or "?" }}* (id: `{{ s.customer_id }}`): {{ s.qty_kg }} kg @ ₹{{ s.rate_per_kg }}/kg = *₹{{ s.total_bill }}* ({{ s.payment_status }})
        {% endfor %}
      hi-Deva: |
        📊 *{{ count }} बिक्रियाँ:*
        {% for s in rows %}* {{ s.sale_date }} — *{{ s.shop_name or "?" }}* (id: `{{ s.customer_id }}`): {{ s.qty_kg }} किलो @ ₹{{ s.rate_per_kg }}/किलो = *₹{{ s.total_bill }}* ({{ s.payment_status }})
        {% endfor %}
      en: |
        📊 *{{ count }} sales:*
        {% for s in rows %}* {{ s.sale_date }} — *{{ s.shop_name or "?" }}* (id: `{{ s.customer_id }}`): {{ s.qty_kg }} kg @ ₹{{ s.rate_per_kg }}/kg = *₹{{ s.total_bill }}* ({{ s.payment_status }})
        {% endfor %}

  query_production:
    list:
      hi-Hind: |
        🏭 *{{ count }} production records:*
        {% for p in rows %}* {{ p.prod_date }} — {{ p.total_produced_kg }} kg, {{ p.total_packets }} packets{% if p.notes %} ({{ p.notes }}){% endif %}
        {% endfor %}
      hi-Deva: |
        🏭 *{{ count }} production records:*
        {% for p in rows %}* {{ p.prod_date }} — {{ p.total_produced_kg }} किलो, {{ p.total_packets }} पैकेट{% if p.notes %} ({{ p.notes }}){% endif %}
        {% endfor %}
      en: |
        🏭 *{{ count }} production records:*
        {% for p in rows %}* {{ p.prod_date }} — {{ p.total_produced_kg }} kg, {{ p.total_packets }} packets{% if p.notes %} ({{ p.notes }}){% endif %}
        {% endfor %}

  query_cash_flow:
    list:
      hi-Hind: |
        💰 *{{ count }} cash flow entries:*
        {% for cf in rows %}* {{ cf.flow_date }} — *{{ cf.flow_type }}* ({{ cf.category }}): ₹{{ cf.amount }} — {{ cf.description }}{% if cf.party %} ({{ cf.party }}){% endif %}
        {% endfor %}
      hi-Deva: |
        💰 *{{ count }} नकद प्रवाह प्रविष्टियाँ:*
        {% for cf in rows %}* {{ cf.flow_date }} — *{{ cf.flow_type }}* ({{ cf.category }}): ₹{{ cf.amount }} — {{ cf.description }}{% if cf.party %} ({{ cf.party }}){% endif %}
        {% endfor %}
      en: |
        💰 *{{ count }} cash flow entries:*
        {% for cf in rows %}* {{ cf.flow_date }} — *{{ cf.flow_type }}* ({{ cf.category }}): ₹{{ cf.amount }} — {{ cf.description }}{% if cf.party %} ({{ cf.party }}){% endif %}
        {% endfor %}

  query_credit_ledger:
    list:
      hi-Hind: |
        📋 *{{ count }} credit entries:*
        {% for cl in rows %}* {{ cl.transaction_date }} — *{{ cl.shop_name or "?" }}* (id: `{{ cl.customer_id }}`): {{ cl.transaction_type }} ₹{{ cl.debit_amount or cl.credit_amount }}
        {% endfor %}
      hi-Deva: |
        📋 *{{ count }} credit प्रविष्टियाँ:*
        {% for cl in rows %}* {{ cl.transaction_date }} — *{{ cl.shop_name or "?" }}* (id: `{{ cl.customer_id }}`): {{ cl.transaction_type }} ₹{{ cl.debit_amount or cl.credit_amount }}
        {% endfor %}
      en: |
        📋 *{{ count }} credit entries:*
        {% for cl in rows %}* {{ cl.transaction_date }} — *{{ cl.shop_name or "?" }}* (id: `{{ cl.customer_id }}`): {{ cl.transaction_type }} ₹{{ cl.debit_amount or cl.credit_amount }}
        {% endfor %}

# ============================================================================
# ERROR MESSAGES (PG_ERROR_MAP + generic)
# ============================================================================

errors:
  numeric_overflow:
    hi-Hind: "❌ Save nahi hua: amount too large. {{ detail }}"
    hi-Deva: "❌ सेव नहीं हुआ: रकम बहुत बड़ी है। {{ detail }}"
    en: "❌ Save failed: amount too large. {{ detail }}"
  customer_not_found:
    hi-Hind: "❌ Save nahi hua: customer not found. {{ detail }}"
    hi-Deva: "❌ सेव नहीं हुआ: ग्राहक नहीं मिला। {{ detail }}"
    en: "❌ Save failed: customer not found. {{ detail }}"
  duplicate_record:
    hi-Hind: "❌ Save nahi hua: record already exists."
    hi-Deva: "❌ सेव नहीं हुआ: रिकॉर्ड पहले से मौजूद है।"
    en: "❌ Save failed: record already exists."
  invalid_value:
    hi-Hind: "❌ Save nahi hua: invalid value. {{ detail }}"
    hi-Deva: "❌ सेव नहीं हुआ: गलत मान। {{ detail }}"
    en: "❌ Save failed: invalid value. {{ detail }}"
  permission_denied:
    hi-Hind: "❌ Permission denied for this operation."
    hi-Deva: "❌ इस operation की अनुमति नहीं है।"
    en: "❌ Permission denied for this operation."
  db_connection_error:
    hi-Hind: "❌ Database reach nahi hua. Thodi der mein retry karein."
    hi-Deva: "❌ डेटाबेस तक नहीं पहुँचा। थोड़ी देर में फिर कोशिश करें।"
    en: "❌ Database unreachable. Please retry shortly."
  db_error:
    hi-Hind: "❌ Save nahi ho paya: {{ detail or 'kuch gadbad' }}"
    hi-Deva: "❌ सेव नहीं हुआ: {{ detail or 'कुछ गड़बड़' }}"
    en: "❌ Save failed: {{ detail or 'something went wrong' }}"
  generic:
    hi-Hind: "❌ Save nahi ho paya: {{ error or 'kuch gadbad' }}"
    hi-Deva: "❌ सेव नहीं हुआ: {{ error or 'कुछ गड़बड़' }}"
    en: "❌ Save failed: {{ error or 'something went wrong' }}"

# ============================================================================
# SELECTION & SEARCH MESSAGES
# ============================================================================

selection:
  multiple_matches:
    hi-Hind: "🔍 *Multiple customers found.* Please select one:"
    hi-Deva: "🔍 *कई ग्राहक मिले।* नीचे से चुनिए:"
    en: "🔍 *Multiple customers found.* Please select one:"
  not_found:
    hi-Hind: "🔍 *No customer matches* `{{ name_fragment }}`. Reply with full details to create a new one, or try a different name."
    hi-Deva: "🔍 *कोई ग्राहक नहीं मिला* `{{ name_fragment }}` से। नया बनाने के लिए details दीजिए, या दूसरा नाम try करें।"
    en: "🔍 *No customer matches* `{{ name_fragment }}`. Reply with full details to create a new one, or try a different name."

# ============================================================================
# SYSTEM MESSAGES (ephemeral)
# ============================================================================

system:
  cancellation:
    hi-Hind: "❌ Cancelled. Kuch save nahi hua."
    hi-Deva: "❌ रद्द किया। कुछ सेव नहीं हुआ।"
    en: "❌ Cancelled. Nothing was saved."
  selection_expired:
    hi-Hind: "⏱️ Selection expired ya already handled."
    hi-Deva: "⏱️ Selection expire हो गया या पहले से handle हो चुका है।"
    en: "⏱️ Selection expired or already handled."
  confirmation_expired:
    hi-Hind: "⏱️ Confirmation expired ya already handled."
    hi-Deva: "⏱️ Confirmation expire हो गया या पहले से handle हो चुका है।"
    en: "⏱️ Confirmation expired or already handled."
  rate_limit_user:
    hi-Hind: "⏳ Apne bahut messages bhej diye. Kripiya ruk ke phir bhejein (~{{ retry }}s)."
    hi-Deva: "⏳ बहुत सारे messages भेज दिए। थोड़ी देर रुकें (~{{ retry }}s)।"
    en: "⏳ Too many messages. Please wait a moment (~{{ retry }}s)."
  rate_limit_server:
    hi-Hind: "⏳ Server busy. Please retry in a few moments."
    hi-Deva: "⏳ सर्वर busy है। थोड़ी देर में फिर कोशिश करें।"
    en: "⏳ Server busy. Please retry in a few moments."
  max_iterations:
    hi-Hind: "⏱️ Bahut steps ho gaye. Asaan task dijiye."
    hi-Deva: "⏱️ बहुत steps हो गए। आसान task दीजिए।"
    en: "⏱️ Too many steps. Please try a simpler task."
  parse_error:
    hi-Hind: "❌ Sorry, main samajh nahi paya. Phir se try karein."
    hi-Deva: "❌ माफ कीजिए, समझ नहीं पाया। फिर से try करें।"
    en: "❌ Sorry, I didn't understand. Please try again."
  generic_error:
    hi-Hind: "❌ Kuch gadbad ho gayi. Kripeya phir se try karein."
    hi-Deva: "❌ कुछ गड़बड़ हो गई। फिर से try करें।"
    en: "❌ Something went wrong. Please try again."
  invalid_selection:
    hi-Hind: "❌ Invalid selection."
    hi-Deva: "❌ गलत selection।"
    en: "❌ Invalid selection."
  history_cleared:
    hi-Hind: "✅ Conversation history cleared."
    hi-Deva: "✅ Conversation history साफ कर दी।"
    en: "✅ Conversation history cleared."

# ============================================================================
# BUTTON LABELS
# ============================================================================

buttons:
  confirm_yes:
    hi-Hind: "✅ Haan, save"
    hi-Deva: "✅ हाँ, सेव करें"
    en: "✅ Yes, save"
  confirm_no:
    hi-Hind: "❌ Nahi"
    hi-Deva: "❌ नहीं"
    en: "❌ No"

# ============================================================================
# COMMAND RESPONSES
# ============================================================================

commands:
  start:
    hi-Hind: |
      🏭 *{{ bot_name }}* activated!

      नमस्ते *{{ first_name }}*! I'm {{ bot_name }}, your factory operations assistant.

      I can help you with:
      - 📦 Sales & customer credit
      - 💰 Production & cash flow
      - 💳 Outstanding balances

      Just send me a message in Hindi, Hinglish, or English.

      Type /help for available commands.
    hi-Deva: |
      🏭 *{{ bot_name }}* चालू!

      नमस्ते *{{ first_name }}*! मैं {{ bot_name }} हूँ, आपका factory operations assistant।

      मैं इसमें मदद कर सकता हूँ:
      - 📦 बिक्री & customer credit
      - 💰 उत्पादन & cash flow
      - 💳 बकाया

      Hindi, Hinglish या English में message भेजें।

      Commands की list के लिए /help।
    en: |
      🏭 *{{ bot_name }}* activated!

      Hello *{{ first_name }}*! I'm {{ bot_name }}, your factory operations assistant.

      I can help you with:
      - 📦 Sales & customer credit
      - 💰 Production & cash flow
      - 💳 Outstanding balances

      Just send me a message in Hindi, Hinglish, or English.

      Type /help for available commands.
  help:
    hi-Hind: |
      *Available Commands*

      /start — Initialize bot
      /help — Show this help
      /status — Check database connection
      /clear — Clear conversation history

      *Quick Examples*

      "Sharma को 50 kg दिया 120 रेट पर"
      (Sale: 50 kg @ ₹120 to Sharma)

      "बकाया देखो" or "Show balances"
      (All outstanding balances)

      "Gupta की payment 5000 दी"
      (Payment: ₹5,000 from Gupta)
    hi-Deva: |
      *Available Commands*

      /start — Bot चालू करें
      /help — यह help देखें
      /status — Database connection check करें
      /clear — Conversation history साफ करें

      *Quick Examples*

      "Sharma को 50 kg दिया 120 रेट पर"
      "बकाया देखो"
