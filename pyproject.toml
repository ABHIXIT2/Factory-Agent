[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "factory-agent"
version = "1.0.0"
description = "Factory operations assistant with Groq LLM and Telegram interface"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv==1.0.0",
    "python-telegram-bot>=22.0,<23",
    "groq>=1.2.0,<2",
    "openai>=1.0,<3",
    "supabase==2.4.0",
    "gotrue<2.5",
    "httpx>=0.27,<0.29",
    "pytz==2024.1",
    "cachetools==5.3.3",
    "tenacity==8.2.3",
    "rapidfuzz>=3.0,<4",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "ruff>=0.4.0",
    "pyright>=1.1.0",
    "pre-commit>=3.7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingImports = true
reportMissingTypeStubs = false
